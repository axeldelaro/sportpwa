<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#09090b" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="ringEmerald" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <linearGradient id="ringCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="ringAmber" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="116" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="8" />
  <!-- Outer Ring (Calories/Energy) -->
  <circle cx="256" cy="256" r="176" fill="none" stroke="#10b981" stroke-opacity="0.16" stroke-width="32" />
  <circle cx="256" cy="256" r="176" fill="none" stroke="url(#ringEmerald)" stroke-width="32" stroke-linecap="round" stroke-dasharray="860 1106" transform="rotate(-90 256 256)" />
  <!-- Middle Ring (Protein/Strength) -->
  <circle cx="256" cy="256" r="130" fill="none" stroke="#38bdf8" stroke-opacity="0.16" stroke-width="30" />
  <circle cx="256" cy="256" r="130" fill="none" stroke="url(#ringCyan)" stroke-width="30" stroke-linecap="round" stroke-dasharray="620 817" transform="rotate(-90 256 256)" />
  <!-- Inner Ring (Macros/Recovery) -->
  <circle cx="256" cy="256" r="86" fill="none" stroke="#f59e0b" stroke-opacity="0.16" stroke-width="28" />
  <circle cx="256" cy="256" r="86" fill="none" stroke="url(#ringAmber)" stroke-width="28" stroke-linecap="round" stroke-dasharray="410 540" transform="rotate(-90 256 256)" />
  <!-- Center Pulse Bolt -->
  <path d="M266 196 L230 260 H262 L246 316 L286 248 H254 Z" fill="#f8fafc" />
</svg>
