name: Build & Release Android APK

on:
  push:
    branches: ['main']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: 'android-apk-build'
  cancel-in-progress: true

jobs:
  build-apk:
    name: Build Signed Pulse.apk
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup Java 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Install web & Capacitor dependencies
        run: npm ci

      - name: Build production web app & sync Capacitor Android
        run: |
          npm run build
          npx cap sync android

      - name: Restore persistent Android signing keystore
        uses: actions/cache@v4
        with:
          path: ~/.pulse-keystore
          key: pulse-android-signing-keystore-v1

      - name: Prepare Android release signing keystore
        id: keystore
        env:
          SECRET_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          SECRET_STORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          SECRET_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          SECRET_KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          mkdir -p ~/.pulse-keystore
          KEYSTORE_FILE="$HOME/.pulse-keystore/pulse-release.p12"

          if [ -n "$SECRET_KEYSTORE_B64" ]; then
            echo "$SECRET_KEYSTORE_B64" | base64 --decode > "$KEYSTORE_FILE"
            STORE_PASS="${SECRET_STORE_PASS:-PulseAndroid2026!}"
            KEY_ALIAS="${SECRET_KEY_ALIAS:-pulse}"
            KEY_PASS="${SECRET_KEY_PASS:-$STORE_PASS}"
          else
            STORE_PASS="PulseAndroid2026!"
            KEY_ALIAS="pulse"
            KEY_PASS="PulseAndroid2026!"
            if [ ! -f "$KEYSTORE_FILE" ]; then
              keytool -genkeypair -v \
                -keystore "$KEYSTORE_FILE" \
                -storetype PKCS12 \
                -alias "$KEY_ALIAS" \
                -keyalg RSA \
                -keysize 2048 \
                -validity 10000 \
                -storepass "$STORE_PASS" \
                -keypass "$KEY_PASS" \
                -dname "CN=Pulse Fitness, OU=Mobile, O=Pulse, L=Paris, ST=IDF, C=FR"
            fi
          fi

          echo "ANDROID_KEYSTORE_PATH=$KEYSTORE_FILE" >> $GITHUB_ENV
          echo "ANDROID_KEYSTORE_PASSWORD=$STORE_PASS" >> $GITHUB_ENV
          echo "ANDROID_KEY_ALIAS=$KEY_ALIAS" >> $GITHUB_ENV
          echo "ANDROID_KEY_PASSWORD=$KEY_PASS" >> $GITHUB_ENV

      - name: Build signed Release APK with Gradle
        working-directory: android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleRelease --no-daemon
          cp app/build/outputs/apk/release/app-release.apk ../Pulse.apk
          ls -lh ../Pulse.apk

      - name: Upload Pulse.apk as GitHub Actions Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Pulse-Android-APK
          path: Pulse.apk
          if-no-files-found: error
          retention-days: 90

      - name: Publish Pulse.apk to GitHub Releases (apk-latest)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-latest
          name: Pulse — Application Android (APK)
          body: |
            ### Application Android autonome — Pulse
            - **Fichier installable directement sur Android :** `Pulse.apk` (signé v1 + v2, compatible Android 6 à Android 15+)
            - **100 % autonome hors-ligne :** intègre les **2 972 aliments ANSES CIQUAL**, les **144 exercices animés**, le **Générateur de semaine**, le **Coach embarqué** et la **Synchronisation Cloud chiffrée**.
            - Généré automatiquement depuis le commit `${{ github.sha }}`.
          files: Pulse.apk
          prerelease: false
          make_latest: true
